# Runs the automatic tests on every push and pull request. A red ✗ next to a
# commit on GitHub means something broke — open the run to see which test failed.
#   • Website:        TypeScript check + production build
#   • Node backend:   syntax check + the 750+ flagging (trigger word) tests
#   • Python service: API tests (security, length limits, uploads, value ranges, retention)
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build

  node-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check backend/server.js
          node --check backend/logger.js
          node --check backend/moderation.js
      - name: Flagging tests (every trigger word, every variation)
        run: node backend/moderation.test.js

  python-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/python/requirements.txt
      - name: Install dependencies (CPU-only PyTorch, like the Space)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: API tests
        run: python -m pytest tests -q
