# Deploys the Python generation service (backend/python) to the Hugging Face
# Space whenever a push to main changes it. GitHub → Railway (Node) and the
# website already deploy on their own; the Space is separate, so this keeps it
# in sync. Needs a repository secret HF_TOKEN (a Hugging Face token with write
# access to the Space): GitHub → Settings → Secrets and variables → Actions.
name: Deploy Python service to Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["backend/python/**"]
  workflow_dispatch: {}   # "Run workflow" button for a manual redeploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: pip install huggingface_hub

      - name: Upload backend/python to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: whysoserious1012/Synthcs
        run: |
          python - <<'PY'
          import os, subprocess
          from huggingface_hub import HfApi

          # Only files tracked in git — never venv, .env, or local datasets
          files = subprocess.run(
              ["git", "ls-files", "backend/python"], capture_output=True, text=True, check=True
          ).stdout.split()
          files = [f.removeprefix("backend/python/") for f in files]

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space",
              folder_path="backend/python", allow_patterns=files,
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          print("Deployed to the Space:", info)
          PY
